############################
### Enviornment Variables###
############################
#Set Editor to nvim
env = EDITOR,nvim
env = VISUAL,nvim
#Set Cursor with hyprcursor
env = HYPRCURSOR_THEME,"Future-Everforest-Hyprcursor_Theme"
env = HYPRCURSOR_SIZE,26
#Set QT stuff for theming qt apps
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland
#Setup XDG menu so default app selection works in dolphin
env = XDG_MENU_PREFIX,arch-
#Set ksshaskpass to ask for the ssh password
env = SSH_ASKPASS,/usr/bin/ksshaskpass
env = SSH_ASKPASS_REQUIRE,prefer

##################
### Auto Starts###
##################
# Disable the top bar buttons
exec-once = gsettings set org.gnome.desktop.wm.preferences button-layout :   
# Start hyprpolkit for asking for elevation
exec-once = systemctl --user start hyprpolkitagent
# Start Utilities
exec-once = uwsm app -- waybar
exec-once = uwsm app -- clipse --listen
#exec-once = uwsm app -- kanata
exec-once = uwsm app -- hyprsunset
# Rebuild XDG MENU after an update
exec-once = XDG_MENU_PREFIX=arch- kbuildsycoca6
# Set Wallpaper
# exec-once = swww-daemon
exec-once = hyprpaper

############
### Input ###
############
# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    accel_profile = flat
    force_no_accel = 1

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}




