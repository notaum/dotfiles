#+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++#


###################
### MY PROGRAMS ###
###################
# See https://wiki.hyprland.org/Configuring/Keywords/
# Set programs that you use

$terminal = kitty
$fileManager = dolphin
$menu = fuzzel
$browser = zen-browser
$notes = obsidian


###################
### KEYBINDINGS ###
###################
binds {
allow_workspace_cycles = true
}
$mainMod = SUPER # Sets "Windows" key as main modifier
# Launch Apps
bind = ALT, SPACE, exec, uwsm app -- $menu
bind = ALT,N, exec, uwsm app -- $notes
bind = $mainMod, C, exec, uwsm app -- $terminal
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, B, exec, uwsm app -- $browser
bind = $mainMod SHIFT, C, exec, uwsm app -- hyprpicker -a
bind = ALT, O, exec, uwsm app -- ~/Scripts/onedrive.sh
bind = ALT SHIFT, O, exec, uwsm app -- ~/Scripts/unmount.sh
bind = ALT SHIFT, S, exec, uwsm app -- flameshot gui
bind = $mainMod, V, exec, kitty --class clipse -e clipse # Clipse Clipboard manager

# Waybar and Kanata Management
bind = SUPER ALT, W, exec, uwsm app -- ~/.config/waybar/waybar.sh
bind = SUPER CTRL, W, exec, ~/.config/waybar/killbar.sh
bind = SUPER ALT, K, exec, uwsm app -- ~/.config/kanata/kanata-toggle.sh

# Window Management
bind = $mainMod, X, killactive,
bind = $mainMod, F, togglefloating,
bind = $mainMod, M, exit
bind = $mainMod, K, exec, hyprctl kill
bind = $mainMod, I, exec, notify-send -t 2000 "$(hyprctl activewindow)"
bind = $mainMod ALT, V, togglesplit, # dwindle
bind = ALT, Tab, workspace, previous # Toggle between current and the previously opened workspace
bind = SUPER ALT, P, exec, poweroff

# Move focus
bind = $mainMod, l, movefocus, l
bind = $mainMod, h, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, A, workspace, e+1
bind = $mainMod, Z, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = ,XF86AudioMute, exec, playerctl play-pause
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, hyprctl hyprsunset gamma +10%
bindel = ,XF86MonBrightnessDown, exec, hyprctl hyprsunset gamma -10%
bindel = CTRL,XF86AudioRaiseVolume, exec, hyprctl hyprsunset gamma +10%
bindel = CTRL,XF86AudioLowerVolume, exec, hyprctl hyprsunset gamma -10%
bindel = ALT,XF86AudioRaiseVolume, exec, hyprctl hyprsunset temperature +500
bindel = ALT,XF86AudioLowerVolume, exec, hyprctl hyprsunset temperature -500


# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
