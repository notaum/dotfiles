binds {
allow_workspace_cycles = true
hide_special_on_workspace_change = true
}

# Set main modifier to SUPER key
$mainMod = SUPER

$reset = hyprctl dispatch submap reset

# Basic app launchers
bind = ALT, SPACE, exec, uwsm app -- $menu
bind = ALT,N, exec, uwsm app -- $notes
bind = $mainMod, C, exec, uwsm app -- $terminal
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, B, exec, uwsm app -- $browser
bind = $mainMod, V, exec, kitty --class clipse -e clipse

# Window Management
bind = $mainMod, X, killactive,
bind = $mainMod, F, togglefloating,
bind = $mainMod, T, exec, hyprctl kill

# Force reset submap in case of issues
bind = $mainMod CTRL ALT, escape, submap, reset

# Utils Submap
bind = $mainMod, A, submap, utils
submap = utils

# Clipboard
bind = $mainMod, V, exec, kitty --class clipse -e clipse

# Colour picker and screenshots
bind =, C, exec, hyprpicker -a & $reset # Colour picker
bind =, S, exec, flameshot gui & $reset # Screenshot tool
bind =, P, exec, waypaper & $reset # Wallpaper changer

# Switch layouts
bind = $mainMod, D, exec, hyprctl keyword general:layout dwindle & $reset
bind = $mainMod, S, exec, hyprctl keyword general:layout scrolling  & $reset

# Mount and Unmount onedrive
bind =, U, exec, uwsm app -- ~/Scripts/unmount.sh & $reset 
bind =, M, exec, uwsm app -- ~/Scripts/onedrive.sh & $reset

# Waybar 
bind =, W, exec, uwsm app -- ~/.config/waybar/waybar.sh & $reset
bind =ALT, W, exec, ~/.config/waybar/killbar.sh & $reset

# Start and kill kanata
bind =, K, exec, uwsm app -- ~/.config/kanata/kanata-toggle.sh & $reset

# Power options
bind = $mainMod, L, exit
bind = $mainMod, R, exec, reboot
bind = $mainMod, P, exec, poweroff

# Leave the submap (it leaves after every command but still)
bind =, return, submap, reset
bind =, return, submap, reset
bind =, escape, submap, reset
bind =, mouse:272, submap, reset
bind =, mouse:273, submap, reset
submap = reset

# Dwindle Layout
bind = $mainMod ALT, V, togglesplit, # dwindle
bind = $mainMod CTRL, R,submap,resize
submap=resize
binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
bind = , Return,submap,reset
submap=reset

# Master Layout


# Scrolling Layout
bind = $mainMod ALT, V, layoutmsg, movewindowto r
bind = $mainMod ALT, C, layoutmsg, movewindowto l # Scrolling layout

# Window managemnt utilities
bind = ALT, Tab, workspace, previous # Toggle between current and the previously opened workspace

# Move focus
bind = $mainMod, l, movefocus, r
bind = $mainMod, h, movefocus, l
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Resize windows
bind = $mainMod SHIFT, l, movefocus, r
bind = $mainMod SHIFT, h, movefocus, l
bind = $mainMod SHIFT, k, movefocus, u
bind = $mainMod SHIFT, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = ALT, mouse:273, colresize


# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = ,XF86AudioMute, exec, playerctl play-pause
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, hyprctl hyprsunset gamma +10%
bindel = ,XF86MonBrightnessDown, exec, hyprctl hyprsunset gamma -10%
bindel = CTRL,XF86AudioRaiseVolume, exec, hyprctl hyprsunset gamma +10%
bindel = CTRL,XF86AudioLowerVolume, exec, hyprctl hyprsunset gamma -10%
bindel = ALT,XF86AudioRaiseVolume, exec, hyprctl hyprsunset temperature +500
bindel = ALT,XF86AudioLowerVolume, exec, hyprctl hyprsunset temperature -500


# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous