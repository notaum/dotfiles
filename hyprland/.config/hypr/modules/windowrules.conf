# Clipboard
windowrule {
  name = clipboard
  float = on
  size = 600 600
  move = (1300) (470)
  match:class = ^(clipse)$
}


# NmTui
windowrule {
  name = wifi
  float = on
  size = 600 600
  match:class = ^(wifi)$
}


# Waypaper (wallpaper switcher)
windowrule {
  name = wallpaper
  float = on
  size = 800 600
  match:class = ^(waypaper)$
}


# Calcurse calendar
windowrule {
  name = calendar
  size = 900 600
  opacity = 0.8
  float = on
  match:class = ^(calendar)$
}


# Ignore maximize requests from apps.
windowrule {
  name = ignore_maximize
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = fix_dragging
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0a
}
